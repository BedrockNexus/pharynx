name: Draft release

on:
  push:
    tags: "*"

permissions:
  contents: write

jobs:
  draft:
    name: Create GitHub draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: "8.2"
          install-path: "./dev/bin"
      - name: Build artifact
        run: php -dphar.readonly=0 build.php
      - name: Record checksum
        run: sha256sum pharynx.phar > pharynx.phar.sha256
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" pharynx.phar pharynx.phar.sha256 plugin-dev/* \
            --draft --title "Version $TAG" --notes "$(git tag -l --format='%(contents)' "$TAG")"
