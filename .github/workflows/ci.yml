name: CI
on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  check:
    name: phpstan, unit tests and code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: "8.2"
          install-path: "./dev/bin"
      - run: composer install --no-interaction --no-progress
      - name: phpstan analyze
        run: vendor/bin/phpstan analyze --no-progress
      - name: unit tests
        run: vendor/bin/phpunit tests
      - name: code style check
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: build phar
        run: php -dphar.readonly=0 build.php
      - name: upload phar
        uses: actions/upload-artifact@v4
        with:
          name: pharynx-phar
          path: pharynx.phar
          if-no-files-found: error

  # Builds a real plugin with Composer dependencies on every PHP version a
  # plugin workflow might use, then loads it the way PocketMine does.
  e2e:
    name: build a plugin on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: ${{ matrix.php }}
          install-path: "./dev/bin"
      - run: composer install --no-interaction --no-progress
      - name: unit tests
        run: vendor/bin/phpunit tests
      - name: build phar
        run: php -dphar.readonly=0 build.php
      - name: build the test plugin
        run: php pharynx.phar -i tests/e2e/plugin -p=dist/e2e.phar
      - name: check the test plugin
        run: php tests/e2e/check.php dist/e2e.phar
